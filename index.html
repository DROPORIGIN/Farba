<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>FARBA V1</title><style>
:root{--bg:#090b0d;--panel:#12161a;--gold:#d7ad54;--muted:#89929b;--felt:#103b2b;--line:#273039}*{box-sizing:border-box}body{margin:0;font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#293039 0,#0c0f12 35%,#050607 100%);color:#f4f4f4;min-height:100vh}.app{max-width:430px;margin:auto;min-height:100vh;padding:22px}.brand{text-align:center;margin:18px 0 28px}.aces{font-size:37px;letter-spacing:4px}.red{color:#c94444}.brand h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:9px;margin:6px 0 0;color:var(--gold)}.sub{color:var(--muted);font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:.8px}.card{background:rgba(18,22,26,.95);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 35px #0007}input,button,select{width:100%;padding:14px;border-radius:12px;border:1px solid #303943;background:#0c1013;color:white;font-size:16px;margin:6px 0}button{background:linear-gradient(180deg,#e1bd68,#b98b31);color:#15110a;font-weight:800;border:0;cursor:pointer}.secondary{background:#1a2025;color:white;border:1px solid #333}.hidden{display:none}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.coin{border:1px solid #665226;background:#19150c;padding:9px 12px;border-radius:999px;color:#f1cb6c;font-weight:800}.table{display:flex;justify-content:space-between;align-items:center;border:1px solid #29323a;background:#11161a;padding:15px;border-radius:16px;margin:10px 0}.table b{display:block}.table small{color:var(--muted)}.table button{width:auto;padding:9px 14px}.felt{height:330px;border-radius:50%;background:radial-gradient(circle,#18543d,#0c2f23);border:8px solid #382a1d;box-shadow:inset 0 0 35px #0009,0 15px 35px #0009;position:relative;margin:28px 0}.pot{position:absolute;top:43%;width:100%;text-align:center;color:#f0ce79;font-weight:800}.seat{position:absolute;background:#111820;border:1px solid #39434c;border-radius:999px;padding:8px 12px;font-size:12px}.s1{bottom:-16px;left:38%}.s2{left:-12px;top:42%}.s3{top:-16px;left:38%}.s4{right:-12px;top:42%}.hand{display:flex;gap:7px;justify-content:center}.playing{width:65px;height:92px;border-radius:9px;background:#f5f2e9;color:#111;padding:7px;font-weight:900;font-size:20px;box-shadow:0 4px 10px #0007}.playing.redc{color:#b51f2e}.playing.selected{transform:translateY(-14px);outline:3px solid #d7ad54}.phasebar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0}.phasebar span{font-size:11px;padding:6px 9px;border:1px solid #303943;border-radius:999px;color:#89929b}.phasebar .on{color:#f0ce79;border-color:#80672f}.discardBtn{margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.actions button{font-size:13px;padding:12px 5px}.status{text-align:center;color:var(--muted);font-size:13px;margin:10px}.adminline{display:flex;gap:6px}.adminline input{width:60%}.adminline button{width:40%}</style></head><body><div class='app'>
<div class='brand'><div class='aces'>A♠ <span class='red'>A♥ A♦</span> A♣</div><h1>FARBA</h1><div class='sub'>Private Card Club</div></div>
<section id='login' class='card'><h2>Beitreten</h2><input id='nick' placeholder='Nickname' maxlength='16'><input id='room' placeholder='Raumcode' maxlength='12'><button onclick='enter()'>IN DIE LOBBY</button></section>
<section id='lobby' class='hidden'><div class='top'><div><b id='hello'></b><div class='sub' id='roomLabel'></div></div><div class='coin'>● <span id='coins'>100</span> Coins</div></div><div class='card'><h3>FARBA Tische</h3><div id='tables'></div></div><div class='card'><h3>Admin · Coins</h3><div class='sub'>Nur Demo-Admin. Später serverseitig nur für deinen Account.</div><div class='adminline'><input id='addCoins' type='number' value='100' min='1'><button onclick='credit()'>Aufladen</button></div></div></section>
<section id='game' class='hidden'><div class='top'><button class='secondary' style='width:auto' onclick='leaveTable()'>← Lobby</button><div class='coin'>● <span id='gameCoins'></span></div></div><div class='status' id='gameTitle'></div><div class='felt'><div class='seat s1' id='meSeat'>DU</div><div class='seat s2'>Freund 1</div><div class='seat s3'>Freund 2</div><div class='seat s4'>Freund 3</div><div class='pot'>POT<br><span id='pot'>6</span> Coins</div></div><div class='phasebar'><span id='pPre' class='on'>PRETHROW</span><span id='pSwap'>TAUSCH</span><span id='pPost'>POT LIMIT</span><span id='pShow'>SHOWDOWN</span></div><div class='hand' id='hand'></div><button id='discardBtn' class='secondary discardBtn hidden' onclick='confirmDiscard()'>AUSGEWÄHLTE KARTEN TAUSCHEN</button><div class='status' id='score'></div><div class='actions'><button onclick="act('FOLD')">FOLD</button><button onclick="act('CALL')">CALL</button><button onclick="act('3× RAISE')">3× RAISE</button><button onclick="act('CHECK')">CHECK</button><button onclick="act('BLIND')">BLIND</button><button onclick="act('TAPIJA')">TAPIJA</button></div><div class='status' id='lastAction'>PreThrow · Du bist dran</div></section>
</div><script>
let balance=100,current=null,deck=[],myHand=[],phase='prethrow',selected=new Set(),potValue=0,currentBet=0,myCommitted=0;
const tableData=[{name:'LOW',sb:1,bb:2,min:20},{name:'CLASSIC',sb:2,bb:4,min:50},{name:'HIGH',sb:5,bb:10,min:150},{name:'VIP',sb:10,bb:20,min:300}];
function enter(){let n=nick.value.trim(),r=room.value.trim();if(!n||!r)return alert('Nickname und Raumcode eingeben.');login.classList.add('hidden');lobby.classList.remove('hidden');hello.textContent=n;roomLabel.textContent='Raum '+r.toUpperCase();renderTables();}
function renderTables(){coins.textContent=balance;tables.innerHTML='';tableData.forEach((t,i)=>{let d=document.createElement('div');d.className='table';d.innerHTML=`<div><b>${t.name} · ${t.sb}/${t.bb}</b><small>2–5 Spieler · Minimum ${t.min} Coins</small></div><button ${balance<t.min?'disabled':''} onclick='join(${i})'>SPIELEN</button>`;tables.appendChild(d)})}
function credit(){let x=+addCoins.value;if(x>0){balance+=x;renderTables()}}
function join(i){current=tableData[i];lobby.classList.add('hidden');game.classList.remove('hidden');gameCoins.textContent=balance;gameTitle.textContent=`${current.name} · Blinds ${current.sb}/${current.bb} · Dealer rotiert`;newRound();}
function leaveTable(){game.classList.add('hidden');lobby.classList.remove('hidden');renderTables()}
const suits=['♠','♥','♦','♣'], ranks=[['7',7,7],['8',8,8],['9',9,9],['10',10,10],['J',10,11],['Q',10,12],['K',10,13],['A',11,14]];
function makeDeck(){let d=[];for(const s of suits)for(const [r,v,ord] of ranks)d.push({s,r,v,ord});for(let i=d.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
function newRound(){deck=makeDeck();myHand=[];selected.clear();phase='prethrow';potValue=current.sb+current.bb;currentBet=current.bb;myCommitted=0;for(let pass=0;pass<2;pass++)myHand.push(...deck.splice(0,2));renderHand();setPhase('prethrow');pot.textContent=potValue;lastAction.textContent='PreThrow · Karten wurden 2 + 2 ausgeteilt · Du bist dran';gameCoins.textContent=balance;}
function renderHand(){hand.innerHTML='';myHand.forEach((c,i)=>{let el=document.createElement('div');el.className=`playing ${c.s==='♥'||c.s==='♦'?'redc':''} ${selected.has(i)?'selected':''}`;el.innerHTML=`${c.r}<br>${c.s}`;el.onclick=()=>toggleCard(i);hand.appendChild(el)});score.textContent='Handwert: '+value(myHand).label;}
function value(h){let cnt={};for(const c of h)cnt[c.ord]=(cnt[c.ord]||0)+1;let four=Object.entries(cnt).find(x=>x[1]===4);if(four){let o=+four[0],c=h.find(x=>x.ord===o);return{type:3,rank:o,label:'Vierling '+c.r+' · 41,5'}}let three=Object.entries(cnt).find(x=>x[1]===3);if(three){let o=+three[0],c=h.find(x=>x.ord===o);return{type:2,rank:o,label:'Drilling '+c.r+' · 31,5'}}let sums={};for(const c of h)sums[c.s]=(sums[c.s]||0)+c.v;let best=Math.max(...Object.values(sums));return{type:1,rank:best,label:best+' Punkte'}}
function setPhase(p){phase=p;for(const id of ['pPre','pSwap','pPost','pShow'])document.getElementById(id).classList.remove('on');({prethrow:'pPre',swap:'pSwap',post:'pPost',show:'pShow'})[p]&&document.getElementById(({prethrow:'pPre',swap:'pSwap',post:'pPost',show:'pShow'})[p]).classList.add('on');discardBtn.classList.toggle('hidden',p!=='swap');selected.clear();renderHand();}
function toggleCard(i){if(phase!=='swap')return;if(selected.has(i))selected.delete(i);else if(selected.size<3)selected.add(i);renderHand();}
function pay(x){x=Math.max(0,Math.min(x,balance));balance-=x;myCommitted+=x;potValue+=x;pot.textContent=potValue;gameCoins.textContent=balance;return x}
function act(a){if(phase==='prethrow')return preAct(a);if(phase==='swap')return lastAction.textContent='Wähle 0–3 Karten und bestätige den Tausch.';if(phase==='post')return postAct(a);if(phase==='show'&&a==='CHECK')newRound();}
function preAct(a){if(a==='FOLD'){lastAction.textContent='FOLD · Hand beendet. Neue Hand wird vorbereitet.';return setTimeout(newRound,900)}if(a==='CALL'){let need=Math.max(0,currentBet-myCommitted);pay(need);lastAction.textContent=`CALL ${need} · PreThrow abgeschlossen → Kartentausch`;return setTimeout(()=>{setPhase('swap');lastAction.textContent='Kartentausch · Wähle 0 bis 3 Karten.'},500)}if(a==='3× RAISE'){let target=currentBet*3,need=target-myCommitted;if(need>balance){return tapija()}pay(need);currentBet=target;lastAction.textContent=`3× RAISE auf insgesamt ${target} · nächster Spieler darf wieder bis 3× erhöhen.`;return}if(a==='TAPIJA')return tapija();lastAction.textContent='In PreThrow: CALL, FOLD, 3× RAISE oder TAPIJA.';}
function confirmDiscard(){let ids=[...selected].sort((a,b)=>b-a);if(ids.length>3)return;ids.forEach(i=>myHand.splice(i,1));while(myHand.length<4)myHand.push(deck.shift());setPhase('post');currentBet=0;myCommitted=0;lastAction.textContent=`${ids.length} Karte${ids.length===1?'':'n'} getauscht · jetzt gilt POT LIMIT.`;}
function postAct(a){if(a==='CHECK'){setPhase('show');lastAction.textContent='CHECK · Demo-Showdown. Handwert: '+value(myHand).label+' · CHECK erneut startet neue Hand.';return}if(a==='BLIND'){let ask=Math.max(1,Math.min(5,potValue,balance));pay(ask);currentBet=ask;lastAction.textContent=`${ask} Coins BLIND gesetzt · nach einem Call bleibt dein zusätzliches Aktionsrecht erhalten.`;return}if(a==='CALL'){let need=Math.max(0,currentBet-myCommitted);pay(need);lastAction.textContent=`CALL ${need} · Gegner ist wieder an der Reihe.`;return}if(a==='3× RAISE'){let maxRaise=potValue;let add=Math.min(maxRaise,balance);pay(add);currentBet=myCommitted;lastAction.textContent=`POT-LIMIT RAISE +${add} · die 3×-Regel gilt hier nicht.`;return}if(a==='FOLD'){lastAction.textContent='FOLD · Hand beendet.';return setTimeout(newRound,900)}if(a==='TAPIJA')return tapija();}
function tapija(){let x=balance;pay(x);lastAction.textContent=`TAPIJA! ${x} Coins All-in · Main-/Sidepot-Logik ist für Multiplayer vorgesehen.`;}
</script></body></html>
