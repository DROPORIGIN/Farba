<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>FARBA · 2D Tisch</title><style>
:root{--gold:#d8b86d;--bg:#080c0e;--felt:#07523d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 30%,#22302c,#080b0d 75%);color:#f5eedc;font-family:system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:950px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font:800 27px Georgia,serif;letter-spacing:5px;color:var(--gold)}.muted{color:#b1ada2;font-size:12px}.gold{color:var(--gold)}.chipbank{background:#18201f;border:1px solid #65563a;border-radius:20px;padding:8px 12px;font-weight:700}.status{min-height:42px;text-align:center;font-size:13px;color:#ebd8a3;margin:10px auto;max-width:550px}.tablebox{position:relative;height:min(60vw,480px);min-height:340px;margin:8px auto 10px}.felt{position:absolute;inset:12% 4%;border:13px solid #181d1d;border-radius:49%;background:radial-gradient(ellipse at 50% 48%,#126c4d,#064330 78%);box-shadow:0 0 0 3px #bb9954,inset 0 0 0 3px #397960,inset 0 0 45px #00291e,0 14px 24px #000a}.felt:after{content:'FARBA';position:absolute;top:45%;left:0;width:100%;text-align:center;font:800 clamp(18px,4vw,35px) Georgia,serif;letter-spacing:9px;color:#d7bd7a3d}.pot{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;background:#071e19cc;border:1px solid #9c8657;border-radius:12px;padding:5px 13px;z-index:2;font-size:12px;white-space:nowrap}.pot b{display:block;font-size:18px;color:#f3d48a}.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(95px,22vw,145px);border-radius:12px;background:linear-gradient(#252b2a,#111716);border:1px solid #6e6650;padding:7px 5px;text-align:center;z-index:4;box-shadow:0 4px 10px #0008}.seat.active{border-color:#ffda74;box-shadow:0 0 15px #e1b95480}.seat .name{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.seat .coins{font-size:11px;color:#dbbf80}.seat .role{position:absolute;right:-8px;top:-11px;border:2 ns button:disabled{opacity:.35}.actions .danger{border-color:#9b4541;background:#492021}.actions .primary{background:linear-gradient(#c7a35e,#846125);color:#10140f}.controls{max-width:700px;margin:12px auto;background:#101716;border:1px solid #55482e;border-radius:14px;padding:12px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.raise{display:flex;align-items:center;gap:9px;justify-content:center;margin:8px 0}.raise input{width:150px;accent-color:#d8b86d}.log{font-size:12px;line-height:1.8;color:#bbb5a5;max-height:88px;overflow:auto}.intro{max-width:400px;margin:14vh auto;background:#121b1a;border:1px solid #927d4d;border-radius:18px;padding:25px;text-align:center}.intro input{width:100%;padding:12px;margin:16px 0;background:#26302e;color:white;border:1px solid #75694c;border-radius:9px}.hidden{display:none!important}.notice{text-align:center;color:#aaa18f;font-size:11px;margin:14px 0}@media(max-width:500px){.wrap{padding:8px}.seat{padding:5px 2px}.seat2{left:27%}.seat3{left:73%}.tablebox{min-height:335px}.seat0{top:93%}.actions button{min-width:72px;padding:11px 8px;font-size:12px}.card{height:83px}}

/* FARBA motion edition */
@keyframes feltEntrance{from{opacity:.4;transform:scale(.91)}to{opacity:1;transform:scale(1)}}
@keyframes dealIn{from{opacity:0;transform:translateY(-95px) scale(.65) rotate(-12deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes chipPop{0%{opacity:0;transform:translateY(-24px) scale(.5)}70%{transform:translateY(3px) scale(1.15)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glowSeat{0%,100%{box-shadow:0 0 10px #e1b95466}50%{box-shadow:0 0 28px #e1b954c0}}
@keyframes potPulse{0%{filter:brightness(1);transform:translate(-50%,-50%) scale(1)}50%{filter:brightness(1.5);transform:translate(-50%,-50%) scale(1.13)}100%{filter:brightness(1);transform:translate(-50%,-50%) scale(1)}}

@keyframes toastSlide{0%{opacity:0;transform:translate(-50%,-20px) scale(.85)}12%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(.95)}}
@keyframes goldShimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes chipFly{0%{opacity:1;transform:translate(0,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.55)}}
@keyframes cardFlip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes tableBreath{0%,100%{box-shadow:0 0 0 3px #bb9954,inset 0 0 0 3px #397960,inset 0 0 45px #00291e,0 14px 24px #000a}50%{box-shadow:0 0 0 3px #e2c077,inset 0 0 0 3px #397960,inset 0 0 65px #003c2a,0 14px 24px #000a}}
.felt{animation:feltEntrance .85s ease-out,tableBreath 6s ease-in-out infinite}.seat.active{animation:glowSeat 2s ease-in-out infinite}.card{transition:transform .22s ease,box-shadow .22s ease;animation:dealIn .48s both;backface-visibility:hidden;perspective:700px}.card:nth-child(2){animation-delay:.10s}.card:nth-child(3){animation-delay:.20s}.card:nth-child(4){animation-delay:.30s}.card:active{transform:scale(.94)}.card.selected{transform:translateY(-12px)}.jeton{animation:chipPop .3s both}.jeton:nth-child(2){animation-delay:.05s}.jeton:nth-child(3){animation-delay:.1s}.jeton:nth-child(4){animation-delay:.15s}.pot.pulse{animation:potPulse .6s ease-out}.tablebox.winner{animation:winnerFlash .65s ease-in-out 3}.actions button{transition:transform .16s,filter .16s,box-shadow .16s}.actions button:active{transform:scale(.93);filter:brightness(1.3)}.actions .primary{background-size:200% auto;background-image:linear-gradient(105deg,#c7a35e,#f5d98a,#846125,#c7a35e);animation:goldShimmer 5s linear infinite}.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);z-index:30;background:#151b19ed;border:2px solid #d8b86d;border-radius:14px;padding:13px 23px;white-space:nowrap;font-weight:900;font-size:18px;color:#f6dc99;box-shadow:0 12px 30px #000b;pointer-events:none;animation:toastSlide 1.55s ease both}.flying-chip{position:fixed;z-index:40;width:23px;height:15px;border-radius:50%;background:#d7a949;border:3px dashed #fff3c2;box-shadow:0 3px 0 #705523,0 6px 0 #2d2615;pointer-events:none;animation:chipFly .65s ease-in forwards}.card.flip{animation:cardFlip .45s ease}.pot b{transition:color .3s} @media(prefers-reduced-motion:reduce){.felt,.seat.active,.card,.jeton,.actions .primary{animation:none!important}.toast,.flying-chip{animation-duration:.01ms!important}}

.showdown-panel{margin:12px auto;max-width:680px;padding:16px;border:1px solid #d6b86b;border-radius:16px;background:linear-gradient(135deg,#172620,#101514);text-align:center;box-shadow:0 0 28px #c9a45733;animation:showReveal .65s ease-out}.showdown-panel h2{color:#f6d27b;margin:4px 0 8px;font-size:21px}.showdown-panel .winning-hand{display:flex;justify-content:center;gap:6px;margin:12px 0}.showdown-panel .winning-hand .card{width:56px;height:78px;font-size:21px;animation:flipIn .55s both}.showdown-panel .winning-hand .card:nth-child(2){animation-delay:.12s}.showdown-panel .winning-hand .card:nth-child(3){animation-delay:.24s}.showdown-panel .winning-hand .card:nth-child(4){animation-delay:.36s}.showdown-panel .winning-hand .card small{font-size:24px}.showdown-panel .detail{color:#d4c9aa;font-size:13px}.showdown-panel .wincoins{font-size:23px;color:#ffdf87;font-weight:800;margin-top:7px}@keyframes showReveal{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes flipIn{from{opacity:0;transform:rotateY(90deg) translateY(15px)}to{opacity:1;transform:rotateY(0) translateY(0)}}
</style></head><body><div class="wrap"><header class="top"><div><div class="logo">♠ FARBA</div><div class="muted">PRIVATE CARD CLUB · 2D</div></div><div class="chipbank">🪙 <span id="bank">2500</span></div></header><div id="intro" class="intro"><div class="logo">♠ FARBA</div><h2>Willkommen am Tisch</h2><p class="muted">Spielbare Einzelgerät-Demo gegen vier Computergegner. Online-Multiplayer folgt.</p><input id="nick" maxlength="18" placeholder="Dein Nickname" value="Mario"><button class="primary" onclick="start()">AN DEN TISCH</button></div><main id="game" class="hidden"><div id="status" class="status"></div><div class="tablebox"><div class="felt"></div><div class="pot">POT <b id="pot">0 🪙</b></div><div id="seats"></div><div id="bets"></div></div><div id="cards" class="cards"></div><div id="showdownResult" class="showdown-panel hidden" aria-live="polite"></div><div class="controls"><div class="row"><b id="stage" class="gold">PRETHROW</b><span id="hint" class="muted"></span></div><div class="raise"><span class="muted">Einsatz</span><input id="raise" type="range" min="1" max="100" value="10" oninput="document.getElementById('raiseVal').textContent=this.value"><b id="raiseVal">10</b></div><div class="actions" id="actions"></div><hr style="border:0;border-top:1px solid #443e30;margin:13px 0"><div class="log" id="log"></div></div><p class="notice">FARBA 2D · Offline-Demo · nur virtuelle Coins</p></main></div><script>
let lastPot=-1,lastStage='',lastAction='',lastRound=0;function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}function flyChips(){const from=document.querySelector('.seat0'),to=document.querySelector('.pot');if(!from||!to)return;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();for(let i=0;i<4;i++){let el=document.createElement('div');el.className='flying-chip';el.style.left=(a.left+a.width/2+(i-2)*8)+'px';el.style.top=(a.top+a.height/2)+'px';el.style.setProperty('--dx',(b.left+b.width/2-a.left-a.width/2-(i-2)*8)+'px');el.style.setProperty('--dy',(b.top+b.height/2-a.top-a.height/2)+'px');el.style.animationDelay=(i*65)+'ms';document.body.appendChild(el);setTimeout(()=>el.remove(),1100)}}
const suits=['♠','♥','♦','♣'],ranks=['7','8','9','10','J','Q','K','A'];let players=[],deck=[],hand=[],stage='pre',dealer=4,turn=0,seconds=60,tick=null,pot=0,carry=0,bet=4,myBet=0,seen=true,selected=[],exchanged=false,round=0,finished=false;const $=id=>document.getElementById(id);const val=c=>c.r==='A'?11:['J','Q','K'].includes(c.r)?10:+c.r;const fmt=n=>n.toLocaleString('de-DE');const addlog=s=>{$('log').innerHTML=`<div>${s}</div>`+$('log').innerHTML};const wait=ms=>new Promise(r=>setTimeout(r,ms));function chips(n){if(!n)return '';let a=[];for(let [v,c] of [[100,'black'],[25,'green'],[5,'red'],[1,'white']]){let k=Math.min(Math.floor(n/v),3);n-=Math.floor(n/v)*v;for(let i=0;i<k;i++)a.push(`<i class="jeton ${c}"></i>`)}return `<div class="stack">${a.join('')}</div>`}function render(){if(!players.length)return;$('bank').textContent=fmt(players[0].coins);$('pot').textContent=fmt(pot)+' 🪙';$('seats').innerHTML=players.map((p,i)=>`<div class="seat seat${i} ${turn===i&&!finished?'active':''}"><span class="role">${i===dealer?'D':i===(dealer+1)%5?'SB':i===(dealer+2)%5?'BB':''}</span><div class="name">${p.name}</div><div class="coins">🪙 ${fmt(p.coins)}</div><div class="action">${p.action||''}</div>${turn===i&&!finished?`<div class="timer" style="width:${seconds/60*100}%"></div>`:''}</div>`).join('');$('bets').innerHTML=players.map((p,i)=>`<div class="bet bet${i}">${chips(p.bet)}${p.bet?fmt(p.bet)+' 🪙':''}</div>`).join('');$('cards').innerHTML=hand.map((c,i)=>`<button class="card ${!seen?'back':selected.includes(i)?'selected':''} ${seen&&['♥','♦'].includes(c.s)?'redsuit':''}" onclick="cardTap(${i})">${seen?`${c.r}<small>${c.s}</small>`:'FARBA'}</button>`).join('');$('stage').textContent=stage==='pre'?'PRETHROW':stage==='swap'?'KARTENTAUSCH':stage==='post'?'NACH DEM TAUSCH':'SHOWDOWN';$('hint').textContent=stage==='swap'?'Bis zu 3 Karten auswählen':!seen?'Karten antippen zum Ansehen':'4 Karten · 32er-Deck';let a=[];if(stage==='pre'){a=[['FOLD','fold','danger'],['CALL '+Math.max(0,bet-myBet),'call',''],['RAISE ×3','raise','primary'],['TAPIJA','allin','']]}else if(stage==='swap'){a=[['TAUSCHEN '+selected.length,'swap','primary']]}else if(stage==='post'){a=[['FOLD','fold','danger'],[bet>myBet?'CALL '+(bet-myBet):'CHECK','call',''],['RAISE','raise','primary'],['TAPIJA','allin','']];if(!seen)a.splice(2,0,['BLIND','blind','primary'])}else a=[['NÄCHSTE RUNDE','next','primary']];$('actions').innerHTML=a.map(([label,action,cls])=>`<button class="${cls}" onclick="act('${action}')">${label}</button>`).join('');$('raise').disabled=stage==='swap'||stage==='end';if(lastPot>=0&&pot>lastPot){let el=document.querySelector('.pot');el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse')}lastPot=pot;}
function shuffle(){deck=[];for(let s of suits)for(let r of ranks)deck.push({s,r});for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function draw(){return deck.pop()}function score(h){let counts={};h.forEach(c=>counts[c.r]=(counts[c.r]||0)+1);let four=Object.entries(counts).find(x=>x[1]===4);if(four)return 200+ranks.indexOf(four[0]);let three=Object.entries(counts).find(x=>x[1]===3);if(three)return 100+ranks.indexOf(three[0]);return Math.max(...suits.map(s=>h.filter(c=>c.s===s).reduce((a,c)=>a+val(c),0)))}function commit(i,n){n=Math.max(0,Math.min(n,players[i].coins));players[i].coins-=n;players[i].bet+=n;pot+=n;return n}function start(){let name=$('nick').value.trim()||'Mario';players=[name,'Ratko','Daniel','Edi','Marcel'].map(n=>({name:n,coins:2500,bet:0,action:'',hand:[]}));$('intro').classList.add('hidden');$('game').classList.remove('hidden');newRound()}function newRound(){clearInterval(tick);$('showdownResult').classList.add('hidden');document.querySelector('.tablebox')?.classList.remove('winner');toast('NEUE RUNDE');round++;finished=false;stage='pre';selected=[];seen=true;exchanged=false;turn=0;seconds=60;bet=4;myBet=0;pot=carry;carry=0;shuffle();players.forEach(p=>{p.bet=0;p.action='';p.hand=Array.from({length:4},draw)});hand=players[0].hand;let sb=(dealer+1)%5,bb=(dealer+2)%5;commit(sb,2);commit(bb,4);if(sb===0)myBet=2;if(bb===0)myBet=4;$('log').innerHTML='';addlog(`Runde ${round} · SB ${players[sb].name}: 2 · BB ${players[bb].name}: 4`);$('status').textContent=`${players[0].name}, du bist dran · 60 Sekunden`;setupRaise();render();timer()}function setupRaise(){let max=stage==='pre'?Math.min(players[0].coins,Math.max(12,bet*3)-myBet):Math.min(players[0].coins,Math.max(1,pot));$('raise').max=Math.max(1,max);$('raise').min=1;$('raise').value=Math.min(max,Math.max(1,bet));$('raiseVal').textContent=$('raise').value}function timer(){clearInterval(tick);seconds=60;tick=setInterval(()=>{seconds--;$('status').textContent=`${players[0].name}, du bist dran · ${seconds} Sekunden`;let bar=document.querySelector('.seat0 .timer');if(bar)bar.style.width=(seconds/60*100)+'%';if(seconds<=0){clearInterval(tick);if(stage==='swap')act('swap');else if(stage==='end')act('next');else act(bet<=myBet?'call':'fold')}},1000)}function cardTap(i){if(!seen&&stage==='post'){toast('KARTEN AUFGEDECKT');seen=true;players[0].action='KARTEN GESEHEN';addlog('Du hast deine Karten angesehen · BLIND nicht mehr möglich');render();return}if(stage==='swap'){let j=selected.indexOf(i);if(j>=0)selected.splice(j,1);else if(selected.length<3)selected.push(i);render()}}function act(a){clearInterval(tick);if(['call','raise','blind','allin'].includes(a)){flyChips();toast(a==='allin'?'TAPIJA!':a==='blind'?'BLIND!':a==='raise'?'RAISE!':'CALL / CHECK')}if(a==='swap')toast('KARTENTAUSCH');if(a==='next'){dealer=(dealer+1)%5;newRound();return}if(stage==='swap'){if(a!=='swap')return;selected.forEach(i=>hand[i]=draw());selected=[];exchanged=true;seen=false;stage='post';bet=0;myBet=0;players.forEach(p=>{p.bet=0;p.action='';let n=Math.floor(Math.random()*4);for(let i=0;i<n;i++)p.hand[i]=draw()});addlog('Karten getauscht · deine Karten liegen verdeckt. BLIND ist verfügbar.');$('status').textContent='Nach dem Tausch: BLIND oder Karten ansehen';setupRaise();render();timer();return}if(a==='fold'){players[0].action='FOLD';addlog('Du hast gefoldet');pot=Math.max(0,pot);endRound(false);return}if(a==='call'){let paid=commit(0,Math.max(0,bet-myBet));myBet+=paid;players[0].action=paid?'CALL '+paid:'CHECK';addlog(`${players[0].name}: ${players[0].action}`)}if(a==='blind'){if(seen)return;let amount=Math.min(players[0].coins,Math.max(1,+$('raise').value));commit(0,amount);myBet+=amount;bet=Math.max(bet,myBet);players[0].action='BLIND '+amount;addlog(`${players[0].name}: BLIND ${amount}`)}if(a==='raise'){let amount=Math.min(players[0].coins,+$('raise').value);if(stage==='pre')amount=Math.min(players[0].coins,Math.max(0,bet*3-myBet));commit(0,amount);myBet+=amount;bet=myBet;players[0].action='RAISE '+amount;addlog(`${players[0].name}: RAISE ${amount}`)}if(a==='allin'){let amount=commit(0,players[0].coins);myBet+=amount;bet=Math.max(bet,myBet);players[0].action='TAPIJA';addlog(`${players[0].name}: TAPIJA ${amount}`)}render();setTimeout(()=>{if(stage==='pre'){stage='swap';bet=0;myBet=0;players.forEach(p=>p.bet=0);addlog('Prethrow abgeschlossen · wähle 0–3 Karten zum Tauschen');$('status').textContent='Wähle Karten zum Tauschen';setupRaise();render();timer()}else if(stage==='post'){showdown()}},450)}function handLabel(h){const counts={};h.forEach(c=>counts[c.r]=(counts[c.r]||0)+1);let four=Object.keys(counts).find(r=>counts[r]===4);if(four)return `Vierling ${four}`;let three=Object.keys(counts).find(r=>counts[r]===3);if(three)return `Drilling ${three}`;let suit=suits.reduce((a,b)=>h.filter(c=>c.s===a).reduce((n,c)=>n+val(c),0)>=h.filter(c=>c.s===b).reduce((n,c)=>n+val(c),0)?a:b);return `${score(h)} Punkte ${suit}`}
function revealShowdown(winnerIds,reason){const box=$('showdownResult');const winner=players[winnerIds[0]];const tie=winnerIds.length>1;const cards=winner.hand.map(c=>`<div class="card ${['♥','♦'].includes(c.s)?'redsuit':''}">${c.r}<small>${c.s}</small></div>`).join('');box.innerHTML=`<div class="muted">SHOWDOWN · KARTEN AUFGEDECKT</div><h2>${tie?'GLEICHSTAND':winner.name+' GEWINNT!'}</h2><div class="winning-hand">${cards}</div><div class="detail">${tie?winnerIds.map(i=>players[i].name).join(' & ')+' · ':''}${handLabel(winner.hand)}</div><div class="wincoins">${tie?'POT WIRD ÜBERNOMMEN':fmt(pot)+' 🪙'}</div>`;box.classList.remove('hidden');box.scrollIntoView({behavior:'smooth',block:'nearest'});addlog(`${reason}: ${winner.name} zeigt ${winner.hand.map(c=>c.r+c.s).join(' ')} · ${handLabel(winner.hand)}`)}
function endRound(won,winnerIndex){finished=true;document.querySelector('.tablebox')?.classList.add('winner');stage='end';const idx=winnerIndex??(won?0:1+Math.floor(Math.random()*4));players[idx].coins+=pot;addlog(`${players[idx].name} gewinnt ${pot} Coins`);$('status').textContent=`${players[idx].name} gewinnt ${fmt(pot)} Coins`;toast(idx===0?'DU GEWINNST!':players[idx].name+' GEWINNT!');pot=0;render()}
function showdown(){const scores=players.map(p=>score(p.hand));const best=Math.max(...scores);const winners=scores.map((v,i)=>v===best?i:-1).filter(i=>i>=0);revealShowdown(winners,'SHOWDOWN');if(winners.length>1){carry=pot;pot=0;finished=true;stage='end';addlog('Gleichstand! Pot wird in nächste Runde übernommen.');$('status').textContent='GLEICHSTAND · POT BLEIBT';toast('GLEICHSTAND');render();return}endRound(winners[0]===0,winners[0])}
</script></body></html>
